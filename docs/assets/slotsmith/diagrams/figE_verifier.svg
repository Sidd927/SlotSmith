<svg xmlns="http://www.w3.org/2000/svg" width="1190" height="520" viewBox="0 0 1190 520"><rect width="100%" height="100%" fill="#ffffff"/><text x="595.0" y="28.0" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#222" text-anchor="middle" font-weight="bold">Figure E. Allocation engine and independent verifier as distinct components</text><text x="595.0" y="48.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#555" text-anchor="middle" font-weight="normal">Only names and slot numbers in the exported workbook cross the boundary. verifier.py imports only rules.py.</text><rect x="20.0" y="70.0" width="270.0" height="250.0" fill="#f6fbf7" stroke="#2f7d4a" stroke-width="1.5" rx="10"/><text x="36.0" y="94.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0f2a18" text-anchor="start" font-weight="bold">Allocation side</text><rect x="40" y="110" width="230" height="80" rx="8" fill="#e8f4ea" stroke="#2f7d4a" stroke-width="1.6"/><text x="155.0" y="137.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0f2a18" text-anchor="middle" font-weight="bold">allocator.py + export.py</text><text x="155.0" y="157.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0f2a18" text-anchor="middle" font-weight="normal">placements are objects in memory;</text><text x="155.0" y="172.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0f2a18" text-anchor="middle" font-weight="normal">export turns them into rows and names</text><rect x="40" y="215" width="230" height="80" rx="8" fill="#e8f4ea" stroke="#2f7d4a" stroke-width="1.6"/><text x="155.0" y="242.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0f2a18" text-anchor="middle" font-weight="bold">pipeline.run()</text><text x="155.0" y="262.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0f2a18" text-anchor="middle" font-weight="normal">writes the workbook, then calls</text><text x="155.0" y="277.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0f2a18" text-anchor="middle" font-weight="normal">the verifier on the file it just wrote</text><polyline points="155.0,191.0 155.0,214.0" fill="none" stroke="#444" stroke-width="1.6"/><polygon points="155.0,214.0 160.0,204.0 150.0,204.0" fill="#444"/><rect x="330" y="150" width="190" height="100" rx="8" fill="#e8f1fb" stroke="#3a6ea5" stroke-width="1.6"/><text x="425.0" y="187.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0d2238" text-anchor="middle" font-weight="bold">Exported workbook</text><text x="425.0" y="207.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0d2238" text-anchor="middle" font-weight="normal">sheet 'IO Allocation':</text><text x="425.0" y="222.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0d2238" text-anchor="middle" font-weight="normal">names and slot numbers only</text><polyline points="271.0,255.0 310.0,255.0 310.0,200.0 329.0,200.0" fill="none" stroke="#444" stroke-width="1.8"/><polygon points="329.0,200.0 319.0,195.0 319.0,205.0" fill="#444"/><rect x="560.0" y="70.0" width="330.0" height="330.0" fill="#fffaf0" stroke="#b07a00" stroke-width="1.5" rx="10"/><text x="576.0" y="94.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3a2900" text-anchor="start" font-weight="bold">Verifier side (verifier.py)</text><rect x="580" y="110" width="290" height="80" rx="8" fill="#fff4d6" stroke="#b07a00" stroke-width="1.6"/><text x="725.0" y="136.8" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3a2900" text-anchor="middle" font-weight="bold">load_allocation + parse names</text><text x="725.0" y="156.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3a2900" text-anchor="middle" font-weight="normal">positions re-derived from the strings</text><text x="725.0" y="171.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3a2900" text-anchor="middle" font-weight="normal">with regexes built from the naming patterns</text><rect x="580" y="215" width="290" height="170" rx="8" fill="#fff4d6" stroke="#b07a00" stroke-width="1.6"/><text x="725.0" y="251.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3a2900" text-anchor="middle" font-weight="bold">11 check families</text><text x="725.0" y="270.5" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#3a2900" text-anchor="middle" font-weight="normal">Q-1  every signal allocated or has a TQ</text><text x="725.0" y="285.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#3a2900" text-anchor="middle" font-weight="normal">D-2  one signal per slot    C-1  capacity</text><text x="725.0" y="299.5" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#3a2900" text-anchor="middle" font-weight="normal">K-1  cable whole, in pair order</text><text x="725.0" y="314.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#3a2900" text-anchor="middle" font-weight="normal">S-1  A and B apart    G-1  groups</text><text x="725.0" y="328.5" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#3a2900" text-anchor="middle" font-weight="normal">P-1  spare    H-1..6  CHARM and block</text><text x="725.0" y="343.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#3a2900" text-anchor="middle" font-weight="normal">N-1..6  names    C-2  controllers</text><text x="725.0" y="357.5" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#3a2900" text-anchor="middle" font-weight="normal">M-1  rows match the MDB</text><polyline points="725.0,191.0 725.0,214.0" fill="none" stroke="#b07a00" stroke-width="1.6"/><polygon points="725.0,214.0 730.0,204.0 720.0,204.0" fill="#b07a00"/><polyline points="521.0,200.0 579.0,150.0" fill="none" stroke="#b07a00" stroke-width="1.8"/><polygon points="579.0,150.0 568.2,152.7 574.7,160.3" fill="#b07a00"/><rect x="330" y="300" width="190" height="60" rx="8" fill="#e8f1fb" stroke="#3a6ea5" stroke-width="1.6"/><text x="425.0" y="324.2" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#0d2238" text-anchor="middle" font-weight="bold">Original MDB rows</text><text x="425.0" y="344.2" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0d2238" text-anchor="middle" font-weight="normal">from ingest.py</text><rect x="330" y="380" width="190" height="60" rx="8" fill="#e8f1fb" stroke="#3a6ea5" stroke-width="1.6"/><text x="425.0" y="404.2" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#0d2238" text-anchor="middle" font-weight="bold">Rule set (rules.py)</text><text x="425.0" y="424.2" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0d2238" text-anchor="middle" font-weight="normal">parameters, hardware table, patterns</text><polyline points="521.0,330.0 579.0,330.0" fill="none" stroke="#b07a00" stroke-width="1.6"/><polygon points="579.0,330.0 569.0,325.0 569.0,335.0" fill="#b07a00"/><polyline points="521.0,410.0 545.0,410.0 545.0,360.0 579.0,360.0" fill="none" stroke="#b07a00" stroke-width="1.6"/><polygon points="579.0,360.0 569.0,355.0 569.0,365.0" fill="#b07a00"/><rect x="930" y="110" width="230" height="80" rx="8" fill="#fff4d6" stroke="#b07a00" stroke-width="1.6"/><text x="1045.0" y="136.8" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3a2900" text-anchor="middle" font-weight="bold">Rule Check report</text><text x="1045.0" y="156.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3a2900" text-anchor="middle" font-weight="normal">PASS / FAIL, violation count,</text><text x="1045.0" y="171.8" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3a2900" text-anchor="middle" font-weight="normal">first five examples per family</text><polyline points="871.0,300.0 905.0,300.0 905.0,150.0 929.0,150.0" fill="none" stroke="#b07a00" stroke-width="1.6"/><polygon points="929.0,150.0 919.0,145.0 919.0,155.0" fill="#b07a00"/><rect x="930" y="235" width="230" height="90" rx="8" fill="#e8f4ea" stroke="#2f7d4a" stroke-width="1.6"/><text x="1045.0" y="260.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#0f2a18" text-anchor="middle" font-weight="bold">All 11 PASS</text><text x="1045.0" y="279.5" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#0f2a18" text-anchor="middle" font-weight="normal">UI: 'Independent check: no violations'</text><text x="1045.0" y="294.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#0f2a18" text-anchor="middle" font-weight="normal">(this dataset, these rules);</text><text x="1045.0" y="308.5" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#0f2a18" text-anchor="middle" font-weight="normal">CLI exit code 0</text><rect x="930" y="350" width="230" height="90" rx="8" fill="#fde8e8" stroke="#b03030" stroke-width="1.6"/><text x="1045.0" y="375.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3a0f0f" text-anchor="middle" font-weight="bold">Any FAIL</text><text x="1045.0" y="394.5" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#3a0f0f" text-anchor="middle" font-weight="normal">UI: 'violations found' + families;</text><text x="1045.0" y="409.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#3a0f0f" text-anchor="middle" font-weight="normal">CLI exit code 2;</text><text x="1045.0" y="423.5" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#3a0f0f" text-anchor="middle" font-weight="normal">report is still written into the workbook</text><polyline points="1045.0,191.0 1045.0,234.0" fill="none" stroke="#444" stroke-width="1.6"/><polygon points="1045.0,234.0 1050.0,224.0 1040.0,224.0" fill="#444"/><polyline points="1161.0,150.0 1172.0,150.0 1172.0,395.0 1161.0,395.0" fill="none" stroke="#444" stroke-width="1.6"/><polygon points="1161.0,395.0 1171.0,400.0 1171.0,390.0" fill="#444"/><text x="595.0" y="480.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#555" text-anchor="middle" font-weight="normal">Shared with the allocator: the RuleSet values, the MDB as read by ingest.py, and the authors' reading of the rules. Not shared: allocator, export and validation code.</text><text x="595.0" y="500.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#555" text-anchor="middle" font-weight="normal">Not checked by any family: group sequence, minimal cabinet span, rules outside the 11 families.</text></svg>