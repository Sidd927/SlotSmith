<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600"><rect width="100%" height="100%" fill="#ffffff"/><text x="550.0" y="28.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#222" text-anchor="middle" font-weight="bold">Figure A. Physical context: where the allocation problem sits (conceptual, not an official vendor drawing)</text><text x="550.0" y="48.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">Capacities from the DeltaV Electronic Marshalling data sheet (12 CHARMs per baseplate, 8 baseplates = 96 channels per CIOC); 4 CIOCs per cabinet is a rule of the problem statement.</text><rect x="30" y="80" width="250" height="80" rx="8" fill="#eef3f7" stroke="#4a6a85" stroke-width="1.6"/><text x="155.0" y="107.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#10202c" text-anchor="middle" font-weight="bold">Field instruments</text><text x="155.0" y="127.5" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#10202c" text-anchor="middle" font-weight="normal">transmitters, switches,</text><text x="155.0" y="143.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#10202c" text-anchor="middle" font-weight="normal">solenoid valves, control valves</text><rect x="30" y="215" width="250" height="90" rx="8" fill="#eef3f7" stroke="#4a6a85" stroke-width="1.6"/><text x="155.0" y="247.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#10202c" text-anchor="middle" font-weight="bold">Multi-pair home-run cable</text><text x="155.0" y="267.5" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#10202c" text-anchor="middle" font-weight="normal">24, 12, 6 or 2 pairs</text><text x="155.0" y="283.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#10202c" text-anchor="middle" font-weight="normal">1 pair = 1 signal = 1 CHARM</text><polyline points="155.0,161.0 155.0,214.0" fill=