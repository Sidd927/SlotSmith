">CIOC and cabinet, under grouping, A/B, spare and hardware rules</text><rect x="330" y="510" width="740" height="70" rx="8" fill="#eef3f7" stroke="#4a6a85" stroke-width="1.6"/><text x="700.0" y="539.8" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#10202c" text-anchor="middle" font-weight="bold">Controllers</text><text x="700.0" y="560.2" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#10202c" text-anchor="middle" font-weight="normal">electronic marshalling: after installation, each channel is assigned to a controller in software (late binding)</text><polyline points="700.0,481.0 700.0,509.0" fill="none" stroke="#444" stroke-width="1.8"/><polygon points="700.0,509.0 705.0,499.0 695.0,499.0" fill="#444"/></svg>