t" font-weight="bold">What changed: the same 12 signals use 2 baseplates</text><text x="596.0" y="390.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3a2900" text-anchor="start" font-weight="normal">instead of 1, and half of each baseplate stays free.</text><text x="596.0" y="414.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3a2900" text-anchor="start" font-weight="normal">This waste is forced by rules 2 and 4, so it counts</text><text x="596.0" y="438.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3a2900" text-anchor="start" font-weight="normal">against capacity (rule 3) and the spare budget (rule 5).</text><text x="596.0" y="462.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3a2900" text-anchor="start" font-weight="normal">Verifier check S-1 fails if A and B share a CIOC.</text></svg>