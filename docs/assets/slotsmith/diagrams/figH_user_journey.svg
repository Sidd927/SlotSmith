<svg xmlns="http://www.w3.org/2000/svg" width="1210" height="480" viewBox="0 0 1210 480"><rect width="100%" height="100%" fill="#ffffff"/><text x="605.0" y="28.0" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#222" text-anchor="middle" font-weight="bold">Figure H. User journey through the Streamlit workbench (routes in parentheses)</text><rect x="20" y="70" width="262" height="112" rx="8" fill="#f1ecfa" stroke="#6a4fa5" stroke-width="1.6"/><text x="151.0" y="104.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#241a3a" text-anchor="middle" font-weight="bold">Landing  (/)</text><text x="151.0" y="125.5" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#241a3a" text-anchor="middle" font-weight="normal">explains the tool; 'Run the</text><text x="151.0" y="141.5" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#241a3a" text-anchor="middle" font-weight="normal">synthetic demo' loads data</text><text x="151.0" y="157.5" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#241a3a" text-anchor="middle" font-weight="normal">and opens Review</text><rect x="322" y="70" width="262" height="112" rx="8" fill="#e8f4ea" stroke="#2f7d4a" stroke-width="1.6"/><text x="453.0" y="104.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#0f2a18" text-anchor="middle" font-weight="bold">1 Input  (/input)</text><text x="453.0" y="125.5" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0f2a18" text-anchor="middle" font-weight="normal">.xlsx / .csv upload or a</text><text x="453.0" y="141.5" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0f2a18" text-anchor="middle" font-weight="normal">synthetic generator;</text><text x="453.0" y="157.5" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0f2a18" text-anchor="middle" font-weight="normal">read errors keep old data</text><rect x="624" y="70" width="262" height="112" rx="8" fill="#e8f4ea" stroke="#2f7d4a" stroke-width="1.6"/><text x="755.0" y="112.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#0f2a18" text-anchor="middle" font-weight="bold">2 Review  (/review)</text><text x="755.0" y="133.5" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0f2a18" text-anchor="middle" font-weight="normal">pre-flight findings (TQs),</text><text x="755.0" y="149.5" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0f2a18" text-anchor="middle" font-weight="normal">column mapping (read-only)</text><rect x="926" y="70" width="262" height="112" rx="8" fill="#e8f4ea" stroke="#2f7d4a" stroke-width="1.6"/><text x="1057.0" y="112.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#0f2a18" text-anchor="middle" font-weight="bold">3 Allocate  (/allocate)</text><text x="1057.0" y="133.5" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0f2a18" text-anchor="middle" font-weight="normal">edit rule parameters, load or</text><text x="1057.0" y="149.5" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0f2a18" text-anchor="middle" font-weight="normal">save rule JSON, press Allocate</text><polyline points="283.0,126.0 321.0,126.0" fill="none" stroke="#444" stroke-width="1.8"/><polygon points="321.0,126.0 311.0,121.0 311.0,131.0" fill="#444"/><polyline points="585.0,126.0 623.0,126.0" fill="none" stroke="#444" stroke-width="1.8"/><polygon points="623.0,126.0 613.0,121.0 613.0,131.0" fill="#444"/><polyline points="887.0,126.0 925.0,126.0" fill="none" stroke="#444" stroke-width="1.8"/><polygon points="925.0,126.0 915.0,121.0 915.0,131.0" fill="#444"/><polyline points="1057.0,183.0 1057.0,248.0" fill="none" stroke="#444" stroke-width="1.8"/><polygon points="1057.0,248.0 1062.0,238.0 1052.0,238.0" fill="#444"/><rect x="20" y="250" width="262" height="112" rx="8" fill="#e8f1fb" stroke="#3a6ea5" stroke-width="1.6"/><text x="151.0" y="284.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#0d2238" text-anchor="middle" font-weight="bold">7 Deliverables  (/deliverables)</text><text x="151.0" y="305.5" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0d2238" text-anchor="middle" font-weight="normal">download Rev A / Rev B workbooks</text><text x="151.0" y="321.5" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0d2238" text-anchor="middle" font-weight="normal">and the rule set (disabled when</text><text x="151.0" y="337.5" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0d2238" text-anchor="middle" font-weight="normal">results are out of date)</text><rect x="322" y="250" width="262" height="112" rx="8" fill="#e8f4ea" stroke="#2f7d4a" stroke-width="1.6"/><text x="453.0" y="284.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#0f2a18" text-anchor="middle" font-weight="bold">6 Revise  (/revise)</text><text x="453.0" y="305.5" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0f2a18" text-anchor="middle" font-weight="normal">choose Rev B, compare and re-allocate;</text><text x="453.0" y="321.5" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0f2a18" text-anchor="middle" font-weight="normal">moved / added / deleted / modified;</text><text x="453.0" y="337.5" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0f2a18" text-anchor="middle" font-weight="normal">solver status; Rev B workbook</text><rect x="624" y="250" width="262" height="112" rx="8" fill="#e8f4ea" stroke="#2f7d4a" stroke-width="1.6"/><text x="755.0" y="292.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#0f2a18" text-anchor="middle" font-weight="bold">5 Cabinets  (/cabinets)</text><text x="755.0" y="313.5" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0f2a18" text-anchor="middle" font-weight="normal">slot map per cabinet, search,</text><text x="755.0" y="329.5" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0f2a18" text-anchor="middle" font-weight="normal">type filter, slot detail</text><rect x="926" y="250" width="262" height="112" rx="8" fill="#fff4d6" stroke="#b07a00" stroke-width="1.6"/><text x="1057.0" y="292.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#3a2900" text-anchor="middle" font-weight="bold">4 Results  (/results)</text><text x="1057.0" y="313.5" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3a2900" text-anchor="middle" font-weight="normal">verifier banner, tiles, rule check,</text><text x="1057.0" y="329.5" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3a2900" text-anchor="middle" font-weight="normal">TQ list, cabinet summary</text><polyline points="925.0,306.0 887.0,306.0" fill="none" stroke="#444" stroke-width="1.8"/><polygon points="887.0,306.0 897.0,311.0 897.0,301.0" fill="#444"/><polyline points="623.0,306.0 585.0,306.0" fill="none" stroke="#444" stroke-width="1.8"/><polygon points="585.0,306.0 595.0,311.0 595.0,301.0" fill="#444"/><polyline points="321.0,306.0 283.0,306.0" fill="none" stroke="#444" stroke-width="1.8"/><polygon points="283.0,306.0 293.0,311.0 293.0,301.0" fill="#444"/><text x="906.0" y="296.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#333" text-anchor="middle" font-weight="normal">next</text><text x="604.0" y="296.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#333" text-anchor="middle" font-weight="normal">next</text><text x="302.0" y="296.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#333" text-anchor="middle" font-weight="normal">next</text><rect x="322" y="372" width="560" height="76" rx="8" fill="#fff4d6" stroke="#b07a00" stroke-width="1.6"/><text x="602.0" y="396.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3a2900" text-anchor="middle" font-weight="bold">Out-of-date handling</text><text x="602.0" y="417.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#3a2900" text-anchor="middle" font-weight="normal">Changing a rule or the data after a run marks results 'out of date' on every</text><text x="602.0" y="432.5" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#3a2900" text-anchor="middle" font-weight="normal">result page and disables downloads until Allocate is run again.</text><rect x="902" y="372" width="286" height="76" rx="8" fill="#f1ecfa" stroke="#6a4fa5" stroke-width="1.6"/><text x="1045.0" y="396.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#241a3a" text-anchor="middle" font-weight="bold">Start over (rail, confirmed)</text><text x="1045.0" y="417.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#241a3a" text-anchor="middle" font-weight="normal">clears data and results,</text><text x="1045.0" y="432.5" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#241a3a" text-anchor="middle" font-weight="normal">keeps the rule settings</text><text x="20.0" y="464.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555" text-anchor="start" font-weight="normal">Stages 2-7 stay disabled until their prerequisite exists (data for 2-3, an allocation for 4-7); the rail allows any enabled stage, and Results has buttons to 5, 6 and 7. A browser refresh starts a new session.</text></svg>