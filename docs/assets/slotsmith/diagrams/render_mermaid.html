<!doctype html><html><head><meta charset="utf-8">
<style>body{margin:0;background:#fff;font-family:Arial,Helvetica,sans-serif} #wrap{display:inline-block;padding:18px;background:#fff} #out{zoom:var(--z,2)}</style></head>
<body><div id="wrap"><div id="out"></div></div>
<script type="module">
import mermaid from '/node_modules/mermaid/dist/mermaid.esm.min.mjs';
import elk from '/node_modules/@mermaid-js/layout-elk/dist/mermaid-layout-elk.esm.min.mjs';
mermaid.registerLayoutLoaders(elk);
const p=new URLSearchParams(location.search); const f=p.get('f'); const z=p.get('z')||'2';
document.documentElement.style.setProperty('--z',z);
const src=await (await fetch('/diagrams/'+f+'.mmd')).text();
mermaid.initialize({startOnLoad:false,theme:'base',securityLevel:'loose',fontFamily:'Arial, Helvetica, sans-serif',
  themeVariables:{fontSize:(p.get('fs')||'15')+'px',primaryColor:'#e8f4ea',lineColor:'#555'},flowchart:{htmlLabels:true,curve:'basis',nodeSpacing:34,rankSpacing:44,padding:12},
  sequence:{useMaxWidth:false,actorMargin:50,messageMargin:34,mirrorActors:false}});
const {svg}=await mermaid.render('g1',src);
document.getElementById('out').innerHTML=svg;
const s=document.querySelector('#out svg'); s.style.maxWidth='none'; const vb=s.viewBox.baseVal; s.setAttribute('width',vb.width); s.setAttribute('height',vb.height); s.style.width=vb.width+'px'; s.style.height=vb.height+'px';
window.__done=true;
</script></body></html>
